[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uart-iic-spi-bridge"
version = "0.1.0"
description = "Host driver for the UART-to-I2C/SPI bridge ASIC"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = ["pyserial>=3.5"]

[project.scripts]
uart-iic-spi-bridge = "uart_iic_spi_bridge.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
