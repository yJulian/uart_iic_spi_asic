# LibreLane configuration for the TinyTapeout-shaped wrapper
# (tt_um_uart_iic_spi_bridge). Run from a LibreLane nix-shell with:
#   librelane flow/tinytapeout/config.yaml
#
# This runs the wrapper through the ordinary Classic flow to confirm it
# synthesizes and places/routes standalone. A real TinyTapeout submission
# instead plugs this RTL into the shared tt-support-tools flow, which
# supplies the fixed die/harness config - not duplicated here.

DESIGN_NAME: tt_um_uart_iic_spi_bridge

VERILOG_FILES:
  - dir::../../rtl/baud_gen.v
  - dir::../../rtl/uart_rx.v
  - dir::../../rtl/uart_tx.v
  - dir::../../rtl/i2c_master.v
  - dir::../../rtl/spi_master.v
  - dir::../../rtl/cmd_engine.v
  - dir::../../rtl/uart_iic_spi_bridge.v
  - dir::../../rtl/tt_um_uart_iic_spi_bridge.v

CLOCK_PERIOD: 90.0
CLOCK_PORT: clk

IO_PIN_ORDER_CFG: dir::pin_order.cfg

pdk::sky130*:
  FP_CORE_UTIL: 35
  scl::sky130_fd_sc_hd:
    CLOCK_PERIOD: 90.0
